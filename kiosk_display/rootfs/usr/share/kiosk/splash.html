<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container { text-align: center; }
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 3rem;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 2rem;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #58a6ff;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.05em;
        }
        .sub {
            font-size: 0.9rem;
            color: #8b949e;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M240 224.762C240 233.18 233.18 240 224.762 240H15.238C6.82 240 0 233.18 0 224.762V15.238C0 6.82 6.82 0 15.238 0H224.762C233.18 0 240 6.82 240 15.238V224.762Z" fill="#18BCF2" opacity="0.9"/>
                <path d="M120 40L40 120H70V200H110V150H130V200H170V120H200L120 40Z" fill="white" opacity="0.95"/>
            </svg>
        </div>
        <h1>Kiosk Display</h1>
        <p class="sub">Initializing display...</p>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</body>
</html>
